spring.application.name=silab

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_silab?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.profiles.active=local,test

spring.jpa.hibernate.ddl-auto=create

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

api.security.token.secret=chave-ultra-secreta
