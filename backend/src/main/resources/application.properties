spring.application.name=silab

spring.datasource.url=jdbc:mysql://localhost:3306/db_silab?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=test

spring.web.error.include-stacktrace=never
#spring.web.error.include-message=never Depois descomentar isso

api.security.token.secret=chave-ultra-secreta